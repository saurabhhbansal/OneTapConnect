name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: OneTapConnect
          path: build/Release/OneTapConnect.exe

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $section = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ') | Where-Object { $_.StartsWith("[$version]") }
          ($section -split '\r?\n', 2)[1].Trim() | Set-Content release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/OneTapConnect.exe
          body_path: release-notes.md
